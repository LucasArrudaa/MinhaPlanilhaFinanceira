services:
  - type: web
    name: minha-planilha-financeira
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: dados-financeiros
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: BOOTSTRAP_NAME
        sync: false
      - key: BOOTSTRAP_EMAIL
        sync: false
      - key: BOOTSTRAP_PASSWORD
        sync: false
